name: Build de teste (temporario)
on:
  push:
    branches: ['claude/project-thread-22omb2']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish ResetExplode.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo
      - uses: actions/upload-artifact@v4
        with:
          name: GLMInfraLuft-teste
          path: dist/GLMInfraLuft.exe
          retention-days: 7
