name: Pre-release de teste (temporario)
on:
  push:
    branches: ['claude/project-thread-22omb2']
permissions:
  contents: write
jobs:
  checar-instaladores:
    runs-on: windows-latest
    steps:
      - name: winget disponivel
        shell: pwsh
        run: |
          winget --version
          winget source update --name winget
      - name: IDs existem no catalogo winget
        shell: pwsh
        run: |
          $ids = 'Google.Chrome','Mozilla.Firefox.pt-BR','Adobe.Acrobat.Reader.64-bit','AnyDesk.AnyDesk','TeamViewer.TeamViewer','RARLab.WinRAR','Skillbrains.Lightshot','ArduinoSA.IDE.stable'
          $fail = @()
          foreach ($id in $ids) {
            $out = winget show --id $id --exact --source winget --accept-source-agreements --disable-interactivity
            $code = $LASTEXITCODE
            ($out | Select-String '^Found') -join ''
            if ($code -ne 0) { $fail += ("{0} (0x{1:X8})" -f $id, $code) }
          }
          if ($fail.Count) { Write-Error "Nao encontrados: $($fail -join ', ')"; exit 1 }
      - name: Instalar de verdade (mesmo comando do app)
        shell: pwsh
        run: |
          foreach ($id in 'RARLab.WinRAR','AnyDesk.AnyDesk','Skillbrains.Lightshot','Mozilla.Firefox.pt-BR') {
            winget install --id $id --exact --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            "{0}: 0x{1:X8}" -f $id, $LASTEXITCODE
          }
      - name: ODT oficial (download e assinatura)
        shell: pwsh
        run: |
          Invoke-WebRequest https://officecdn.microsoft.com/pr/wsus/setup.exe -OutFile setup.exe
          $sig = Get-AuthenticodeSignature setup.exe
          $sig.Status; $sig.SignerCertificate.Subject
          if ($sig.Status -ne 'Valid') { exit 1 }
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish ResetExplode.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo
      - name: Atualizar pre-release "teste"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete teste --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create teste dist/GLMInfraLuft.exe --target $env:GITHUB_SHA --prerelease --latest=false --title "GLM INFRA LUFT (teste do PR #4)" --notes "Versão de teste do PR #4 (correção dos instaladores). Não é a versão oficial."
