name: Pre-release de teste (temporario)
on:
  push:
    branches: ['claude/project-thread-22omb2']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish ResetExplode.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo
      - name: Atualizar pre-release "teste"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ($i = 1; $i -le 4; $i++) {
            gh release create teste-dominio dist/GLMInfraLuft.exe --target $env:GITHUB_SHA --prerelease --latest=false --title "GLM INFRA LUFT (teste do PR #4: domínio)" --notes "Versão de teste do PR #4 (ingresso no domínio). Não é a versão oficial."
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (15 * $i)
          }
          exit 1
